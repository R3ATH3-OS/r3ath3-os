[package]
name = "r3ath3-kernel"
version = "0.0.1"
edition = "2021"
publish = false
description = "R3@TH3 OS bare-metal x86_64 boot milestone for QEMU"

[[bin]]
name = "r3ath3"
path = "src/main.rs"
test = false
bench = false

[features]
default = []
# Test-only boot paths. Enable at most one.
fault-panic = []
fault-hang = []
capture = []
fault-ud = []
fault-pf = []
fault-df = []
script = []
kbd-script = []
ticks = []
keys = []
heap = []
heap-oom = []
heap-oom-panic = []
frames = []
frames-oom = []
mem-badinfo = []
# Internal. Not a test mode. Implied by `shell` and by every `sched-*` proof.
sched = []
sched-coop = ["sched"]
sched-preempt = ["sched"]
sched-sleep = ["sched"]
sched-full = ["sched"]
sched-exit = ["sched"]
sched-reap = ["sched"]
# Internal. Not a test mode. Implied by `shell`, `gate-core`, and `gate-expire`.
gate = []
gate-core = ["gate"]
gate-expire = ["gate", "sched"]
# Internal. Not a test mode. Implied by `shell` and `recorder-core`.
recorder = []
recorder-core = ["recorder"]
# Internal. Not a test mode. Implied by `shell` and `store-core`.
# `sched` is required because `IrqCell` lives in `context.rs`.
store = ["sched", "recorder"]
store-core = ["store"]
# Internal. Not a test mode. Implied by `shell` and `nvme-core`.
nvme = ["sched"]
nvme-core = ["nvme"]
# Internal. Not a test mode. Implied by `shell` and `wasm-core`.
wasm = []
wasm-core = ["wasm"]
wasm-glue = ["wasm"]
# Internal. Not a test mode. Implied by `shell` and `fb-core`.
fb = []
fb-core = ["fb", "wasm"]
# Internal. Not a test mode. Implied by `shell` and `speaker-core`.
speaker = []
speaker-core = ["speaker"]
# Internal. Not a test mode, and not part of the "at most one" assert.
# Smoke turns it on for the shell image after `scripts/build-apps.sh`.
# `include_bytes!` of `glue_duty.wasm` is behind this feature and `wasm-glue`.
glue-baked = []
shell = ["sched", "gate", "recorder", "store", "nvme", "wasm", "fb", "speaker"]

[profile.dev]
panic = "abort"
debug = true

[profile.release]
panic = "abort"
lto = false
codegen-units = 1
opt-level = 2
strip = false
