[package]
name = "r3ath3-kernel"
version = "0.0.1"
edition = "2021"
publish = false
description = "R3@TH3 OS bare-metal x86_64 boot milestone for QEMU"

[[bin]]
name = "r3ath3"
path = "src/main.rs"
test = false
bench = false

[features]
default = []
# Test-only boot paths. Enable at most one.
fault-panic = []
fault-hang = []
capture = []
fault-ud = []
fault-pf = []
fault-df = []
script = []
kbd-script = []
ticks = []
keys = []
heap = []
heap-oom = []
heap-oom-panic = []
frames = []
frames-oom = []
mem-badinfo = []
shell = []

[profile.dev]
panic = "abort"
debug = true

[profile.release]
panic = "abort"
lto = false
codegen-units = 1
opt-level = 2
strip = false
