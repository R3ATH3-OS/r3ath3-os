[package]
name = "r3ath3-kernel"
version = "0.0.1"
edition = "2021"
publish = false
description = "R3@TH3 OS bare-metal x86_64 boot milestone for QEMU"

[[bin]]
name = "r3ath3"
path = "src/main.rs"
test = false
bench = false

[features]
default = []
# Test-only boot paths. Enable at most one.
fault-panic = []
fault-hang = []
capture = []
fault-ud = []
fault-pf = []
fault-df = []
script = []
kbd-script = []
ticks = []
keys = []
heap = []
heap-oom = []
heap-oom-panic = []
frames = []
frames-oom = []
mem-badinfo = []
# Internal. Not a test mode. Implied by `shell` and by every `sched-*` proof.
sched = []
sched-coop = ["sched"]
sched-preempt = ["sched"]
sched-sleep = ["sched"]
sched-full = ["sched"]
sched-exit = ["sched"]
shell = ["sched"]

[profile.dev]
panic = "abort"
debug = true

[profile.release]
panic = "abort"
lto = false
codegen-units = 1
opt-level = 2
strip = false
